name: Publish release

# Publishes the APK that was already signed with the D2 release key and committed to
# the `apk` branch, as a GitHub Release with a direct download link.
#
# It deliberately does not build or sign anything. The release key is not on this
# runner and should not be: putting it in a repository secret would copy it somewhere
# more people can read than the one person who holds it, and a key that has been
# copied is no longer evidence of who built a release. So the APK is signed where the
# key lives, and this job's only job is to refuse to publish anything that is not
# signed with it — which it checks against the certificate itself rather than trusting
# that a secret was configured.
#
#   push tag v1.5.2   → publishes LRMS-v1.5.2-SIGNED.apk from the apk branch
#   manual            → the same, for a version already sitting on that branch

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already committed to the apk branch, e.g. 1.5.2'
        required: true
        type: string

permissions:
  contents: write

env:
  JAVA_VERSION: '17'
  ANDROID_BUILD_TOOLS: '35.0.0'
  # The D2 release certificate, the same fingerprint printed in KEYSTORE-SETUP.md and
  # in the apk branch README. An APK carrying any other certificate cannot install
  # over the copy already on an agent's phone, so publishing one would strand every
  # handset in the field.
  EXPECTED_CERT_SHA256: '8bb48d4ef31a3504c40d7268a8d2bd3da6b06c19ad5004340354f15c6a324355'

jobs:
  publish:
    name: Verify the signature and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the signed-APK branch
        uses: actions/checkout@v4
        with:
          ref: apk

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Only for apksigner, which is the tool that can read an APK's signing
      # certificate. Nothing here compiles.
      - name: Set up Android SDK build-tools
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;${{ env.ANDROID_BUILD_TOOLS }}

      - name: Resolve the version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
            TAG="v${VERSION}"
          fi

          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk=LRMS-v${VERSION}-SIGNED.apk" >> "$GITHUB_OUTPUT"
          echo "Publishing v${VERSION} from tag ${TAG}"

      - name: Find the signed APK
        run: |
          APK="${{ steps.version.outputs.apk }}"

          if [[ ! -f "$APK" ]]; then
            echo "::error::${APK} is not on the apk branch."
            echo "Sign that version with the release key and commit it there first."
            echo "What the branch currently holds:"
            ls -1 ./*.apk 2>/dev/null || echo "  (no APKs at all)"
            exit 1
          fi

          echo "Found ${APK} ($(stat -c%s "$APK") bytes)."

      - name: Verify it carries the D2 release certificate
        run: |
          APK="${{ steps.version.outputs.apk }}"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          if [[ ! -x "$APKSIGNER" ]]; then
            echo "::error::apksigner not found at ${APKSIGNER}."
            exit 1
          fi

          # Fails on its own if the APK is unsigned or the signature does not match
          # its contents, which is the first thing worth knowing.
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "${RUNNER_TEMP}/verify.txt"

          DIGESTS=$(grep -ioE 'certificate SHA-256 digest: [0-9a-f]{64}' "${RUNNER_TEMP}/verify.txt" \
            | awk '{print tolower($NF)}' | sort -u)

          if [[ -z "$DIGESTS" ]]; then
            echo "::error::apksigner printed no certificate digest, so nothing was verified."
            exit 1
          fi

          # Every signer must be the expected one, not merely one of them.
          while read -r digest; do
            if [[ "$digest" != "${EXPECTED_CERT_SHA256}" ]]; then
              echo "::error::Signed with ${digest}, expected ${EXPECTED_CERT_SHA256}."
              echo "This APK was not signed with the D2 release key. Refusing to publish it:"
              echo "Android would not let it install over the copy already on a phone, so"
              echo "every agent would have to uninstall the app and lose anything unsynced."
              exit 1
            fi
          done <<< "$DIGESTS"

          echo "Certificate matches the D2 release key."

      - name: Publish the release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="${{ steps.version.outputs.apk }}"
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.name }}"

          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(du -h "$APK" | cut -f1)
          NOTES="${RUNNER_TEMP}/notes.md"
          DIRECT="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}"

          {
            echo "## LRMS Field v${VERSION}"
            echo
            echo "**[Download ${APK}](${DIRECT})** — open this on the phone and Android"
            echo "will offer to install it."
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Server | https://cvbuilder.bharatseo.site/api/v1/ |"
            echo "| Signed by | D2 Recovery Solutions and Services, Katihar, Bihar, IN |"
            echo "| Certificate SHA-256 | \`${EXPECTED_CERT_SHA256}\` |"
            echo "| File SHA-256 | \`${SHA}\` |"
            echo "| Size | ${SIZE} |"
            echo
            echo "The certificate was verified by this workflow before the file was"
            echo "attached, so this build installs over any earlier one without"
            echo "uninstalling. Check the download before installing:"
            echo
            echo '```'
            echo "sha256sum ${APK}"
            echo '```'
            echo
            echo "Published from the \`apk\` branch by run"
            echo "[#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          } > "$NOTES"

          # Reuse the release when the tag has already been published, so re-running
          # replaces the asset instead of failing on a duplicate.
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)

          if [[ -z "$RELEASE_ID" || "$RELEASE_ID" == "null" ]]; then
            RELEASE_ID=$(jq -n \
              --arg tag "$TAG" \
              --arg name "LRMS Field v${VERSION}" \
              --rawfile body "$NOTES" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}' \
              | gh api "repos/${GITHUB_REPOSITORY}/releases" --input - --jq '.id')
            echo "Created release ${RELEASE_ID}."
          else
            jq -n --arg name "LRMS Field v${VERSION}" --rawfile body "$NOTES" \
              '{name: $name, body: $body}' \
              | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - --silent
            echo "Reusing release ${RELEASE_ID}."
          fi

          # An asset of the same name from an earlier run would make the upload fail.
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
                        --jq ".[] | select(.name == \"${APK}\") | .id"); do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" --silent
            echo "Removed the previous ${APK} asset."
          done

          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"${APK}" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${APK}" \
            > "${RUNNER_TEMP}/asset.json"

          UPLOADED=$(jq -r '.browser_download_url' "${RUNNER_TEMP}/asset.json")
          STATE=$(jq -r '.state' "${RUNNER_TEMP}/asset.json")

          if [[ "$STATE" != "uploaded" ]]; then
            echo "::error::Asset finished in state '${STATE}'."
            cat "${RUNNER_TEMP}/asset.json"
            exit 1
          fi

          echo "url=${UPLOADED}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### LRMS Field v${{ steps.version.outputs.name }}"
            echo
            if [[ -n "${{ steps.release.outputs.url }}" ]]; then
              echo "Direct download: <${{ steps.release.outputs.url }}>"
              echo
              echo "- File SHA-256: \`${{ steps.release.outputs.sha }}\`"
              echo "- Certificate verified against the D2 release key before publishing."
            else
              echo "Nothing was published. See the failed step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
