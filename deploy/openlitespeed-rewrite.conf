# LRMS — rewrite rules for OpenLiteSpeed / CyberPanel
#
# WHEN YOU NEED THIS
# OpenLiteSpeed does not read .htaccess unless it is told to. If you enabled
# `autoLoadHtaccess 1` in the vHost config (see HOSTING-CYBERPANEL.md) then the
# shipped .htaccess files are used and you do NOT need this file.
#
# Use this instead when .htaccess is not being honoured — the symptom is that the
# sign-in page loads but every other URL returns 404.
#
# WHERE TO PUT IT
# CyberPanel ▸ Websites ▸ List Websites ▸ Manage ▸ Rewrite Rules,
# paste the block below, Save, then restart OpenLiteSpeed.
#
# THIS ASSUMES the document root already points at public_html/public. If it
# still points at public_html, fix that first — these rules do not compensate
# for it, and leaving the document root one level up exposes config/ and
# storage/ to the internet.

RewriteEngine On

# Pass the HTTP Authorization header through to PHP. The Android app
# authenticates with a bearer token, and some FastCGI setups drop this header,
# which makes every API call look unauthenticated.
RewriteCond %{HTTP:Authorization} .
RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

# Everything that is not a real file or directory goes to the front controller.
RewriteCond %{REQUEST_FILENAME} !-f
RewriteCond %{REQUEST_FILENAME} !-d
RewriteRule ^(.*)$ index.php [L]

# ---------------------------------------------------------------------------
# Optional: force HTTPS.
#
# Prefer CyberPanel's own "Force HTTP -> HTTPS" switch on the website's SSL
# page. Only uncomment this if you are not using that, otherwise the two can
# fight each other and produce a redirect loop.
# ---------------------------------------------------------------------------
# RewriteCond %{HTTPS} !=on
# RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

# ---------------------------------------------------------------------------
# Belt and braces: refuse to serve application internals even if the document
# root is misconfigured. With a correct document root these paths are not
# reachable anyway, so this costs nothing and protects you from a mistake.
# ---------------------------------------------------------------------------
RewriteRule ^\.\.?/ - [F,L]
RewriteRule (^|/)\.(?!well-known) - [F,L]
RewriteRule ^(app|config|database|resources|routes|storage|vendor|deploy)(/|$) - [F,L]
RewriteRule \.(sql|log|md|yml|yaml|lock|jks|keystore)$ - [F,L]
