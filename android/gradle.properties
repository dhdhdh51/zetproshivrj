org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# API base URL for DEBUG builds.
#
# Points at the real server, not an emulator loopback. A debug APK that talks to
# 10.0.2.2 cannot work on a physical handset — every request times out and looks
# like a weak signal — and whoever installs it is usually not the person who can
# tell one artifact from another.
#
# To develop against a PHP server on your own machine, change this line locally
# (or pass -PlrmsApiUrl) to http://10.0.2.2:8000/api/v1/ for the emulator, or
# http://<your-lan-ip>:8000/api/v1/ for a handset on the same wifi. Cleartext is
# permitted for loopback addresses in res/xml/network_security_config.xml.
lrmsDebugApiUrl=https://cvbuilder.bharatseo.site/api/v1/

# The production server this app talks to. Committed here on purpose so that a
# plain `./gradlew assembleRelease` — or a CI run by someone who has not set any
# repository variable — still produces an APK pointing at the real server instead
# of a placeholder host that silently fails on every device.
#
# Precedence: -PlrmsApiUrl (CI's LRMS_API_URL variable) > this value.
# Change this line when the server moves. It must be HTTPS or the build fails.
lrmsReleaseApiUrl=https://cvbuilder.bharatseo.site/api/v1/
