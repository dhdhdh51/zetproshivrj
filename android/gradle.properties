org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# API base URL for local DEBUG builds only (emulator loopback to a host running
# `php -S`). Deliberately a debug-only property: staging and release builds ignore
# it, so a developer default can never be compiled into a build handed to field
# staff. Those get their URL from -PlrmsApiUrl (CI reads the LRMS_API_URL
# repository variable) and the build fails if it is not HTTPS.
lrmsDebugApiUrl=http://10.0.2.2:8000/api/v1/
